schema_version: 1
status: FROZEN_AWAITING_USER_APPROVAL_NO_REPRESENTATIONS_RUN
source: Official EWAS Catalog Zenodo fallback
complete_current_catalog_coverage: false
catalog_study_ids_available: false
selection_uses_representation_results: false
selection_rule:
- main_eligible
- descending intersected positive count
- complete matching
- descending N_study
- ascending source_analysis_id
support_tiers:
  main_eligible: '>=200 intersected positives'
  exploratory: 100–199
  insufficient_support: <100
task_counts:
  Cancer: 5
  Immune/inflammatory: 4
  Cardiometabolic: 4
  total: 13
terms:
  primary: EWAS Catalog-associated CpGs; p < 1e-4
  sensitivity: high-confidence EWAS-associated CpGs; p < 1e-7
universe_size: 408399
matching:
  main: Exact chromosome x Infinium type; 1:1 without replacement
  genomic_context_s1: EWAS-v2 exact chromosome x Infinium type x island class; nearest
    neighbor standardized GC, CpG density hg38, stored log10 TSS distance; Euclidean
    caliper 0.25; ddof=0 over probe-known universe
  seed: 17
  pair_cap: null
  background_exclusion: Union of all 351 inventory primary p<1e-4 sets and the 16
    frozen EWAS-v2 sets; fixed at both p thresholds
  mask_sha256: 231e80bd489c464d416e78fca64fa0e25309c3492f1ecb67b91336f34363627c
  same_pairs_for_all_representations: true
evaluation_contract_from_ewas_v2:
  folds:
    map: biological_validation_v2.splits.chromosome_blocked_folds(chr1..chr22, 5,
      seed=17)
    n_outer: 5
    pair_in_one_fold: true
  probe:
    model: LogisticRegression
    penalty: l2
    solver: lbfgs
    class_weight: null
    max_iter: 10000
    C_grid:
    - 0.001
    - 0.01
    - 0.1
    - 1.0
    - 10.0
    C_selection: 'nested: per outer fold, leave-one-outer-train-fold-out inner CV
      on the outer-train rows only; mean inner AUROC; ties -> smaller C; refit on
      the outer-train rows'
    scaler: StandardScaler fitted only on the training rows of each inner or outer
      fold; never on validation/test rows
    scores: OOF decision_function, float64, stored
    n_fits_per_task_design: 105
    implementation: bioval_v2_launch.chrom_probes.logistic_blocked_cv (imported, unmodified)
    convergence: n_iter_max and n_nonconverged_fits recorded per endpoint; contrasts
      refuse non-converged fits unless --allow-nonconverged (then flagged)
  zero_rows:
    policy: candidate zero rows kept as valid features; identical backgrounds for
      all arms; counts of all-zero rows among positives and backgrounds per task,
      arm, design reported
  uncertainty:
    scheme: paired chromosome-block bootstrap; bioval_v2_launch.block_bootstrap.BlockBootstrap(names=sorted
      chr1..chr22, B=1000, seed=17); block weights = multiplicity; pairs never split;
      same draws for every arm/task/metric/design
    ci: 95% percentile
    p: two-sided bootstrap p with (1+k)/(1+B) floor (descriptive)
    multiplicity: NONE (descriptive; no adjustment, no Holm gating)
evaluation_addenda:
  matched_pair_concordance: P(OOF score positive > OOF score matched background);
    strict ties count zero
  category_average_auroc: false
  category_win_counts: false
  AUROC: pooled out-of-fold primary
  AUPRC: secondary descriptive; artificial 50% prevalence
  bootstrap: paired chromosome blocks; 1000 draws; seed 17; percentile 95% CI; identical
    draws all arms and contrasts
  contrasts:
  - Regulatory - CpGPT
  - Regulatory - DeepCpG
  - CpGPT - DeepCpG
  sensitivity_panel: Same source analyses; no reselection/drop based on strict-threshold
    support
representations:
- regulatory_histone_dnase_v1
- cpgpt_large_locus native 512D
- deepcpg_dna_locus native 128D
