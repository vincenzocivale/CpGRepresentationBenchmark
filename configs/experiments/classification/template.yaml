# Copy once per phenotype (age bin, mortality, disease) and change only phenotype + name.
experiment:
  name: disease_classification
  task: disease
  output_root: outputs

dataset:
  name: tcga_array
  methylation_h5: data/methylation/tcga_array_official_full.h5
  cpg_registry: data/cpg/registries/array_cpg_map.parquet
  chromosomes: null
  patient_split: [0.80, 0.10, 0.10]

phenotype:
  parquet: data/phenotypes/tcga_clinical.parquet
  sample_column: sample_name
  target_column: disease_label
  task_type: multiclass  # regression | binary | multiclass
  # classes: [class_a, class_b, ...]  # strongly recommended for paper runs

representation:
  name: REPLACE_ME
  family: genomic_fm
  track: native_frozen
  component: locus_only
  source: REPLACE_ME
  mode: precomputed
  store_h5: data/cache/representations/REPLACE_ME.h5
  id_key: auto
  embedding_key: auto

model:
  locus_latent_dim: 256
  token_dim: 256
  patient_dim: 256
  hidden_dim: 512
  dropout: 0.10

training:
  seed: 17
  device: cuda
  epochs: 50
  batch_size: 16
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  mixed_precision: true
  num_workers: 4
  panel_size: 4096
  mask_fractions: [0.00, 0.15, 0.30, 0.50]
  beta_epsilon: 1.0e-4

evaluation:
  panel_size: 4096
  selection_mask_fraction: 0.30
  mask_fractions: [0.00, 0.15, 0.30, 0.50, 0.70, 0.90]
  batch_size: 16
  num_workers: 2
  save_predictions: true
