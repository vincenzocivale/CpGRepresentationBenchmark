experiment:
  task: masking
  name: masking_representation_controlled_genomewide_deepcpg
  output_root: outputs
  locus_split:
    heldout_fraction: 0.0
    seed: 17
    protocol_path: data/protocols/tcga_array_genomewide_masking_seed17_noholdout.npz

dataset:
  name: tcga_array_genomewide
  methylation_h5: data/methylation/tcga_array_official_full.h5
  cpg_registry: data/cpg/registries/array_cpg_map.parquet
  patient_split: [0.80, 0.10, 0.10]

representation:
  name: deepcpg_dna_locus
  family: methylation_fm
  track: native_frozen
  component: locus_only
  source: DeepCpG DNA-module (sequence-only) stem activation per CpG, HCC checkpoint (CnnL2h128); see scripts/deepcpg/README.md
  mode: precomputed
  store_h5: data/cache/representations/deepcpg_dna_locus.h5
  provenance:
    checkpoint: hcc_dna
    genome_build: GRCh38
    patient_specific: false
    supervision: none
    locus_fit_scope: external_pretrained
    pooling: deepcpg_dna_module_stem_pre_output_head

model: {locus_latent_dim: 256, token_dim: 256, patient_dim: 256, hidden_dim: 512}
training:
  seed: 17
  device: cuda
  epochs: 30
  batch_size: 8
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  mixed_precision: true
  num_workers: 4
  panel_size: 2048
  mask_fractions: [0.15, 0.30, 0.50, 0.70, 0.90]
  beta_epsilon: 1.0e-4
evaluation:
  panel_size: 2048
  mask_fractions: [0.15, 0.30, 0.50, 0.70, 0.90]
  selection_mask_fraction: 0.50
  batch_size: 8
  num_workers: 2
  save_predictions: false
