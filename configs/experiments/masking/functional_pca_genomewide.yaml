experiment:
  task: masking
  name: masking_representation_controlled_genomewide_functional_pca
  output_root: outputs
  locus_split:
    heldout_fraction: 0.0
    seed: 17
    protocol_path: data/protocols/tcga_array_genomewide_masking_seed17_noholdout.npz

dataset:
  name: tcga_array_genomewide
  methylation_h5: data/methylation/tcga_array_official_full.h5
  cpg_registry: data/cpg/registries/array_cpg_map.parquet
  patient_split: [0.80, 0.10, 0.10]

representation:
  name: functional_annotations_pca
  family: functional_annotations
  track: native_frozen
  component: locus_only
  source: reference-genome functional annotations -> unsupervised PCA/SVD compaction
  mode: precomputed
  store_h5: data/cache/representations/functional_annotations__pca_native_genomewide.h5
  provenance:
    patient_specific: false
    reference_genome_only: true
    supervision: none
    locus_fit_scope: unsupervised

model: {locus_latent_dim: 256, token_dim: 256, patient_dim: 256, hidden_dim: 512}
training:
  seed: 17
  device: cuda
  epochs: 30
  batch_size: 8
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  mixed_precision: true
  num_workers: 4
  panel_size: 2048
  mask_fractions: [0.15, 0.30, 0.50, 0.70, 0.90]
  beta_epsilon: 1.0e-4
evaluation:
  panel_size: 2048
  mask_fractions: [0.15, 0.30, 0.50, 0.70, 0.90]
  selection_mask_fraction: 0.50
  batch_size: 8
  num_workers: 2
  save_predictions: false
