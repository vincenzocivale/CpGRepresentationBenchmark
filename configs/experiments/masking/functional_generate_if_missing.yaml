experiment:
  name: masking_representation_controlled_chr1
  output_root: outputs
  locus_split:
    heldout_fraction: 0.20
    seed: 17
    protocol_path: data/protocols/tcga_array_chr1_masking_seed17_holdout20.npz

dataset:
  name: tcga_array_chr1
  methylation_h5: data/methylation/tcga_array_official_full.h5
  cpg_registry: data/cpg/registries/array_cpg_map.parquet
  chromosomes: [chr1]
  patient_split: [0.80, 0.10, 0.10]

representation:
  name: functional_annotations_chr1
  source: MehylPredictor functional-locus encoder over reference-genome functional annotations
  mode: generate_if_missing
  store_h5: data/cache/representations/functional_annotations_chr1.h5
  supported_chromosomes: [chr1]
  id_key: cpg_idx
  embedding_key: embedding
  generator:
    command:
      - python
      - scripts/build_functional_embeddings.py
      - --checkpoint
      - data/external/functional/checkpoints/functional_encoder.pt
      - --array-cpg-map
      - "{registry}"
      - --locus-store
      - data/external/functional/locus_features_v1
      - --methylpredictor-root
      - ../MehylPredictor
      - --output
      - "{output}"
      - --chromosomes
      - chr1
  provenance:
    patient_specific: false
    reference_genome_only: true
    supervision: methylation_proxy_or_task_trained
    locus_fit_scope: unknown
    benchmark_scope: chr1
    note: Audit encoder supervision scope and annotation tracks before strict representation-OOD claims.

model:
  locus_latent_dim: 256
  token_dim: 256
  patient_dim: 256
  hidden_dim: 512

training:
  seed: 17
  device: cuda
  epochs: 30
  batch_size: 8
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  mixed_precision: true
  num_workers: 4
  panel_size: 2048
  mask_fractions: [0.15, 0.30, 0.50, 0.70, 0.90]
  beta_epsilon: 1.0e-4

evaluation:
  panel_size: 2048
  mask_fractions: [0.15, 0.30, 0.50, 0.70, 0.90]
  selection_mask_fraction: 0.50
  batch_size: 8
  num_workers: 2
  save_predictions: false
