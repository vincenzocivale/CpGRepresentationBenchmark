  cost_estimate:                    # conservative, see README; per run = ~7 min setup + 120 x ~49 s + ~1 min eval (5 fractions: ~2-3 min)
    per_run_hours: {main_native_256_or_less: 1.8, cpgpt_large_512: 2.1}
    main_available_runs: 12
    sensitivity_runs: 6
    pending_modern_fm_runs: 6
