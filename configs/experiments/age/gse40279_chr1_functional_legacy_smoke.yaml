experiment:
  name: gse40279_age_chr1_smoke
  task: age
  output_root: outputs

dataset:
  name: gse40279
  methylation_h5: data/processed/GSE40279/methylation.h5
  cpg_namespace: grch38_cpg_cytosine_1based_v1
  reference_build: GRCh38
  coordinate_convention: 1-based position of CpG cytosine
  chromosomes: null
  locus_protocol: data/protocols/GSE40279/smoke_chr1_functional_ntv3_common.npz
  patient_split: [0.80, 0.10, 0.10]

phenotype:
  parquet: data/processed/GSE40279/phenotypes.parquet
  sample_column: sample_name
  target_column: age
  task_type: regression

representation:
  name: functional_annotations_chr1
  family: functional_annotations
  track: legacy
  component: locus_only
  source: historical functional locus checkpoint materialized directly from GRCh38 coordinates
  mode: precomputed
  store_h5: data/cache/representations/materialized/GSE40279/shared_chr1/functional_legacy.h5
  id_key: cpg_idx
  embedding_key: embedding
  cpg_namespace: grch38_cpg_cytosine_1based_v1
  reference_build: GRCh38
  coordinate_convention: 1-based position of CpG cytosine
  provenance:
    materialization: direct_coordinate_inference
    purpose: pipeline_smoke_test_only
    publication_ranking: false

model:
  locus_latent_dim: 256
  token_dim: 256
  patient_dim: 256
  hidden_dim: 512
  dropout: 0.10

training:
  seed: 17
  device: cuda
  epochs: 10
  batch_size: 16
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  mixed_precision: true
  num_workers: 4
  panel_size: 2048
  mask_fractions: [0.00, 0.50]
  beta_epsilon: 1.0e-4

evaluation:
  panel_size: 2048
  selection_mask_fraction: 0.50
  mask_fractions: [0.00, 0.50, 0.90]
  batch_size: 16
  num_workers: 2
  save_predictions: true
