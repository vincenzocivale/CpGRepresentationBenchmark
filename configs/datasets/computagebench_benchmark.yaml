name: computagebench_benchmark
source_repository: computage/computage_bench
source_split: benchmark
methylation_h5: data/processed/ComputAgeBench/benchmark/methylation.h5
phenotypes_parquet: data/processed/ComputAgeBench/benchmark/phenotypes.parquet
cpg_mapping_parquet: data/processed/ComputAgeBench/benchmark/cpg_mapping.parquet
cpg_registry: data/processed/ComputAgeBench/benchmark/cpg_mapping.parquet
reference_build: GRCh38
coordinate_convention: 1-based position of CpG cytosine
cpg_namespace: grch38_cpg_cytosine_1based_v1
platform: mixed Illumina 27K/450K/EPIC arrays
sample_type: blood, saliva and buccal samples
primary_tasks:
  age_regression:
    target_column: age
    task_type: regression
  aging_accelerating_condition:
    target_column: is_aging_accelerating_condition
    task_type: binary
