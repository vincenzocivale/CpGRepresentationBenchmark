# Canonical representation catalog. Every downstream task consumes only the locus-only
# HDF5 cache; extraction/training happens before the benchmark run.
representations:
  functional_annotations_pca:
    name: functional_annotations_pca
    family: functional_annotations
    track: native_frozen
    component: locus_only
    mode: precomputed
    store_h5: data/cache/representations/functional_annotations__pca_native_genomewide.h5
    source: reference-genome functional annotations -> unsupervised PCA/SVD compaction
    provenance:
      patient_specific: false
      reference_genome_only: true
      supervision: none
      locus_fit_scope: unsupervised

  ntv3_pre_native:
    name: ntv3_pre
    family: genomic_fm
    track: native_frozen
    component: locus_only
    mode: precomputed
    store_h5: data/derived/ntv3_pre_chr1_atlas/chr1_ntv3_pretrain_atlas_v1.h5
    source: Nucleotide Transformer v3 pre-training checkpoint
    provenance:
      patient_specific: false
      supervision: genomic_pretraining
      locus_fit_scope: external_pretrained

  cpgpt_locus_native:
    name: cpgpt_locus
    family: methylation_fm
    track: native_frozen
    component: locus_only
    mode: precomputed
    store_h5: data/cache/representations/cpgpt_locus.h5
    source: CpGPT (small) DNA-sequence-encoder projection per CpG; see scripts/cpgpt/README.md
    provenance:
      checkpoint: small
      genome_build: GRCh38
      patient_specific: false
      supervision: none
      locus_fit_scope: external_pretrained
      pooling: cpgpt_dna_sequence_projection_no_positional_encoding

  methylgpt_locus_native:
    name: methylgpt_locus
    family: methylation_fm
    track: native_frozen
    component: locus_only
    mode: precomputed
    store_h5: data/cache/representations/methylgpt_locus.h5
    source: MethylGPT patient-agnostic CpG/locus component only

  dnambert_locus_native:
    name: dnambert_locus
    family: methylation_fm
    track: native_frozen
    component: locus_only
    mode: precomputed
    store_h5: data/cache/representations/dnambert_locus.h5
    source: DNAmBERT patient-agnostic locus component only

  methylprophet_locus_native:
    name: methylprophet_locus
    family: genomic_fm
    track: native_frozen
    component: locus_only
    mode: precomputed
    store_h5: data/cache/representations/methylprophet_locus.h5
    source: MethylProphet genomic locus representation without patient RNA/value information
