[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cpg-representation-benchmark"
version = "0.2.0"
description = "Controlled benchmarking of patient-agnostic CpG representations across methylation tasks"
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.10",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "torch>=2.2",
  "tqdm>=4.66",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
tracking = ["wandb>=0.18"]
viz = ["matplotlib>=3.8", "umap-learn>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
